<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>云家居 · 演示视频</title>
<style>
  :root{
    --bg:#0b1020; --card:#121a30; --line:#243154;
    --txt:#eaf0ff; --muted:#93a2c9; --accent:#4d8dff; --accent2:#22c8a8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:"Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    color:var(--txt);
    background:
      radial-gradient(1100px 600px at 12% -10%, rgba(77,141,255,.22), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(34,200,168,.16), transparent 55%),
      var(--bg);
    min-height:100%;
    display:flex; align-items:center; justify-content:center;
    padding:28px 16px;
  }
  .wrap{width:100%;max-width:920px}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:16px}
  h1{font-size:clamp(20px,3.4vw,30px);margin:0;letter-spacing:.5px}
  .chip{font-size:12px;color:var(--muted);border:1px solid var(--line);
    border-radius:999px;padding:4px 10px;background:rgba(255,255,255,.03)}
  .card{
    background:linear-gradient(180deg,var(--card),#0e1527);
    border:1px solid var(--line);
    border-radius:18px;
    padding:14px;
    box-shadow:0 24px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.04);
  }
  video{
    width:100%;height:auto;display:block;border-radius:12px;background:#000;
    outline:none;
  }
  .bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
  .meta{font-size:13px;color:var(--muted);flex:1;min-width:180px}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    font-size:14px;font-weight:600;color:#08122b;text-decoration:none;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    border-radius:10px;padding:10px 16px;border:0;cursor:pointer;
    transition:transform .15s ease, filter .15s ease;
  }
  .btn:hover{transform:translateY(-1px);filter:brightness(1.06)}
  .btn.ghost{
    color:var(--txt);background:rgba(255,255,255,.05);
    border:1px solid var(--line);
  }
  footer{margin-top:14px;font-size:12px;color:var(--muted);line-height:1.7}
  code{
    background:rgba(255,255,255,.07);padding:2px 6px;border-radius:6px;
    font-family:Consolas,monospace;font-size:12px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>云家居 · 智能家居演示</h1>
    <span class="chip">640×368 · H.264</span>
    <span class="chip" id="dur">时长加载中…</span>
  </header>

  <div class="card">
    <video id="player" controls playsinline preload="metadata"
           poster="poster.jpg" src="yun-jiaju.mp4">
      你的浏览器不支持 HTML5 视频，请
      <a href="yun-jiaju.mp4">点此下载视频</a>。
    </video>

    <div class="bar">
      <div class="meta">STM32 + ESP8266 + 机智云 · 暑假实训项目演示</div>
      <a class="btn" href="yun-jiaju.mp4" download>下载原视频</a>
      <a class="btn ghost" href="yun-jiaju.mp4" target="_blank" rel="noopener">新窗口打开</a>
    </div>
  </div>

  <footer>
    直接分享视频文件链接：<code id="direct"></code><br>
    手机与电脑在同一 WiFi 时，用电脑的局域网地址即可播放（见 README）。
  </footer>
</div>

<script>
  const v = document.getElementById('player');
  const fmt = s => {
    if (!isFinite(s) || s <= 0) return '';
    const m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return m + ':' + String(sec).padStart(2, '0');
  };
  v.addEventListener('loadedmetadata', () => {
    document.getElementById('dur').textContent = '时长 ' + fmt(v.duration);
  });
  document.getElementById('direct').textContent =
    location.origin + location.pathname.replace(/[^/]*$/, '') + 'yun-jiaju.mp4';
</script>
</body>
</html>
